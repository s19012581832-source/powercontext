    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.9
          mode: chat
          name: gpt-4o-mini
          provider: openai
        prompt_template:
        - id: 7f3c1a9e-0010-4a2b-8c11-000000000010
          role: system
          text: '你是武侠文字冒险《江湖·记忆》的"江湖说书人"。你负责根据玩家的行动，续写一段有武侠味、有画面感、越聊越离奇的冒险剧情。\n\n你的写作要求：\n1. 文风半文半白、简洁有江湖气，多用短句与动作描写。\n2. 若下方"回忆"中提到了玩家过往做的事，必须自然地呼应（例如"你这偷玉佩的小贼，又回来了？"），让玩家感到你真的记得他。\n3. 若下方"相关桥段/武学设定"提供了素材，请合理融入剧情，保持世界观一致（门派、武功名称需一致）。\n4. 每次只续写一小段（200字以内），并在结尾抛出一个新的处境或选择，引导玩家继续。\n5. 不要替玩家做决定，只描述世界如何回应他的行动。'
        - id: 7f3c1a9e-0011-4a2b-8c11-000000000011
          role: user
          text: '玩家编号：{{#player#}}\n玩家本回合的行动：{{#action#}}\n\n—— 来自过往会话的回忆（可能为空） ——\n{{#memory#}}\n\n—— 相关剧情桥段素材 ——\n{{#scene#}}\n\n—— 相关武学/门派设定 ——\n{{#entity#}}\n\n请以上述信息续写这一回合的江湖剧情，并在结尾抛出一个新的处境或选择。'
        selected: false
        title: 续写江湖剧情
        type: llm
        variables:
        - value_selector:
          - sys
          - query
          variable: action
        - value_selector:
          - '1003'
          - body
          variable: memory
        - value_selector:
          - '1004'
          - body
          variable: scene
        - value_selector:
          - '1005'
          - body
          variable: entity
        - value_selector:
          - conversation
          - player_id
          variable: player
        vision:
          enabled: false
