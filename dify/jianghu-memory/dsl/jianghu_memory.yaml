app:
  description: '《江湖·记忆》—— 会记住你的武侠文字冒险。\n\n使用 Dify 编排核心流程，结合 OceanBase seekdb（武侠世界观设定检索）与 PowerContext（跨会话玩家记忆）。\n玩家用一句话描述行动（如"我去后山练剑，遇见一只白猿"），AI 说书人据此续写越聊越离奇的武侠冒险；\nseekdb 负责检索门派/武功/桥段/NPC 设定以保证世界观一致，PowerContext 让 NPC 在新会话里依然记得你上次干的事。\n\n技术分工：\n- Dify：输入处理、模型调用、工具调用、条件判断与结果输出（核心编排）\n- seekdb：应用功能层，承担"武侠世界观设定库"的向量+全文混合检索（横向世界知识）\n- PowerContext：应用功能层，承担"玩家角色卡与剧情进度"的跨会话记忆（纵向玩家状态）'
  icon: sword
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 江湖记忆
  use_icon_as_answer_icon: true
kind: app
version: 0.1.5
workflow:
  conversation_variables:
  - description: 玩家标识，用于隔离不同玩家的跨会话记忆（PowerContext scope）。默认演示玩家，可改为任意唯一值。
    id: 7f3c1a9e-0001-4a2b-8c11-000000000001
    name: player_id
    selector:
    - conversation
    - player_id
    value: demo-player-001
    value_type: string
  environment_variables:
  - description: PowerContext 服务地址
    id: 7f3c1a9e-0002-4a2b-8c11-000000000002
    name: PC_URL
    selector:
    - env
    - PC_URL
    value: http://127.0.0.1:8000
    value_type: string
  - description: seekdb 网关服务地址
    id: 7f3c1a9e-0003-4a2b-8c11-000000000003
    name: SEEKDB_URL
    selector:
    - env
    - SEEKDB_URL
    value: http://127.0.0.1:8001
    value_type: string
  - description: PowerContext 鉴权 Token（本地默认无鉴权可留空；启用服务端鉴权后填入 Bearer Token）
    id: 7f3c1a9e-0004-4a2b-8c11-000000000004
    name: PC_TOKEN
    selector:
    - env
    - PC_TOKEN
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '<center><font size=4>《江湖·记忆》</font></center>\n\n      <div><font size=2>你是一名初入江湖的少侠。用一句话描述你的行动或选择，AI 说书人会据此续写属于你的武侠冒险。</font></div>\n\n      <div><font size=2>例：「我去后山练剑，遇见一只白猿」「我偷了少林掌门的玉佩」「酒楼里有个陌生人向我搭话」</font></div>\n\n      <div><font size=2>提示：本游戏会记住你——换一个新对话，NPC 仍会记得你曾做过的事。</font></div>'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      configs: []
      enabled: false
      type: ''
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我去后山练剑，遇见一只白猿
    - 我走进热闹的江湖酒楼
    - 我偷了少林掌门的玉佩
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: http-request
      id: start-source-1001-target
      selected: false
      source: start
      sourceHandle: source
