        x: 30
        y: 300
      positionAbsolute:
        x: 30
        y: 300
      selected: false
      type: custom
      width: 242
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - key: title
            type: mixed
            value: 江湖记忆-玩家
          - key: summary
            type: mixed
            value: 玩家角色卡与剧情进度
          - key: idempotency_key
            type: mixed
            value: '{{#conversation.player_id#}}'
          type: json
        desc: ''
        headers: 'Content-Type: application/json'
        method: post
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 创建/获取玩家记忆空间
        type: http-request
        url: '{{#env.PC_URL#}}/v1/scopes'
        variables: []
      height: 119
